
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0F0F12">
<title>RD4X | Key Generation</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --bg:#0F0F12;
  --surface:#18181D;
  --surface2:#1F1F25;
  --border:#302F36;
  --text:#EBE9EC;
  --muted:#918F97;
  --accent:#7E2B3E;
  --accent-dark:#5B1F2D;
  --green:#5BA677;
  --red:#D66A78;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  min-height:100vh;
  background:
    radial-gradient(ellipse at 50% 0%,#7e2b3e22,transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:Inter,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px 15px;
}

.container {
  width:100%;
  max-width:420px;
  animation:appear .7s ease;
}

@keyframes appear {
  from {opacity:0;transform:translateY(18px)}
  to {opacity:1;transform:translateY(0)}
}

.panel {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  padding:25px 21px;
  box-shadow:0 20px 70px #0008;
  position:relative;
  overflow:hidden;
}

.panel::before {
  content:"";
  position:absolute;
  top:0;
  left:12%;
  width:76%;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
}

.header {
  text-align:center;
  margin-bottom:25px;
}

.logo {
  width:82px;
  height:82px;
  object-fit:cover;
  border-radius:50%;
  padding:3px;
  background:linear-gradient(135deg,#A54860,#5B1F2D);
  border:2px solid #A54860;
  box-shadow:0 0 12px #7e2b3e66,0 0 28px #7e2b3e33;
  margin-bottom:13px;
}

.brand {
  font-family:Orbitron,sans-serif;
  font-size:25px;
  font-weight:800;
  letter-spacing:3px;
}

.brand span {
  color:#B65A70;
}

.subtitle {
  color:var(--muted);
  font-size:11px;
  letter-spacing:2px;
  margin-top:7px;
}

.status {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  margin-top:15px;
  font-size:10px;
  color:var(--green);
  letter-spacing:1px;
}

.status-dot {
  width:7px;
  height:7px;
  background:var(--green);
  border-radius:50%;
  box-shadow:0 0 9px var(--green);
}

.section-title {
  font-size:11px;
  font-weight:700;
  color:var(--muted);
  letter-spacing:1.5px;
  margin-bottom:12px;
}

.info-box {
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:17px;
  margin-top:15px;
  color:var(--muted);
  font-size:11px;
  line-height:1.7;
  text-align:center;
}

.icon {
  font-size:30px;
  margin-bottom:10px;
}

.heading {
  color:var(--text);
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
}

.description {
  margin-top:10px;
}

.primary {
  display:block;
  width:100%;
  border:0;
  border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  color:white;
  font-weight:800;
  font-size:12px;
  letter-spacing:1.5px;
  padding:15px;
  margin-top:18px;
  cursor:pointer;
  text-align:center;
  text-decoration:none;
}

.primary:disabled {
  opacity:.5;
  cursor:not-allowed;
}

#generateButton[hidden] {
  display:none;
}

.notice {
  font-size:9px;
  color:var(--muted);
  text-align:center;
  margin-top:13px;
  line-height:1.6;
}

.footer {
  text-align:center;
  margin-top:22px;
}

.footer-line {
  height:1px;
  background:var(--border);
  margin-bottom:17px;
}

.social-title {
  color:var(--muted);
  font-size:9px;
  letter-spacing:2px;
  margin-bottom:12px;
}

.social-links {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
}

.social-button {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:9px 12px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--surface2);
  color:var(--text);
  text-decoration:none;
  font-size:10px;
  font-weight:600;
}

.social-button svg {
  width:18px;
  height:18px;
  fill:currentColor;
}

.discord-disabled {
  opacity:.55;
  cursor:default;
}

.copyright {
  font-size:9px;
  color:#66636C;
  margin-top:16px;
}

@media(max-width:360px) {
  .panel {padding:22px 15px}
  .brand {font-size:22px}
}
</style>
</head>

<body>

<div class="container">
<main class="panel">

<header class="header">
  <img
    class="logo"
    src="https://i.ibb.co/Y7Z0PHVb/1795367917827.png"
    alt="RD4X"
  >

  <div class="brand">RD4<span>X</span></div>
  <div class="subtitle">KEY GENERATION SYSTEM</div>

  <div class="status">
    <span class="status-dot"></span>
    SYSTEM ONLINE
  </div>
</header>

<section>
  <div class="section-title">
    01 / LINKVERTISE VERIFICATION
  </div>

  <div class="info-box" id="result">
    <div class="icon">⏳</div>
    <div class="heading">AGUARDE</div>
    <p class="description">
      Estamos preparando a verificação do seu acesso.
    </p>
  </div>

  <button
    class="primary"
    id="generateButton"
    type="button"
    hidden
  >
    GERAR CHAVE
  </button>

  <div class="notice" id="notice">
    Não feche esta página durante a verificação.
  </div>
</section>

<footer class="footer">
  <div class="footer-line"></div>

  <div class="social-title">
    ACOMPANHE O RD4X
  </div>

  <div class="social-links">

    <a
      href="https://www.tiktok.com/@nxz.xz7k"
      target="_blank"
      rel="noopener noreferrer"
      class="social-button"
    >
      <svg viewBox="0 0 24 24">
        <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.33V2h-3.44v13.67a2.9 2.9 0 0 1-2.9 2.9 2.9 2.9 0 1 1 2.9-2.9c0-.2-.02-.4-.05-.59v-3.5a6.34 6.34 0 1 0 3.5 5.67V9.3a8.2 8.2 0 0 0 4.8 1.54V7.4a4.85 4.85 0 0 1-1.04-.71z"/>
      </svg>
      TikTok
    </a>

    <a
      href="https://www.instagram.com/n.x.z7?hvrq=MTBhMjA4dmMwNGI0dQ=="
      target="_blank"
      rel="noopener noreferrer"
      class="social-button"
    >
      <svg viewBox="0 0 24 24">
        <path d="M7 2C4.24 2 2 4.24 2 7v10c0 2.76 2.24 5 5 5h10c2.76 0 5-2.24 5-5V7c0-2.76-2.24-5-5-5H7zm0 2h10c1.66 0 3 1.34 3 3v10c0 1.66-1.34 3-3 3H7c-1.66 0-3-1.34-3-3V7c0-1.66 1.34-3 3-3zm11.5 1.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2zM12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/>
      </svg>
      Instagram
    </a>

    <div class="social-button discord-disabled">
      <svg viewBox="0 0 24 24" aria-label="Discord">
        <path d="M19.73 5.1A18.2 18.2 0 0 0 15.25 3.7l-.55 1.12a16.6 16.6 0 0 0-5.4 0L8.75 3.7A18.2 18.2 0 0 0 4.27 5.1C1.43 9.3.66 13.4 1.04 17.45a18.3 18.3 0 0 0 5.48 2.78l1.18-1.92c-.65-.24-1.27-.54-1.86-.89l.45-.35c3.58 1.67 7.46 1.67 11 0l.46.35c-.59.35-1.22.65-1.87.89l1.18 1.92a18.3 18.3 0 0 0 5.48-2.78c.45-4.7-.77-8.76-3.81-12.35zM8.8 14.7c-1.08 0-1.96-.99-1.96-2.2s.86-2.2 1.96-2.2 1.98.99 1.96 2.2c0 1.21-.86 2.2-1.96 2.2zm6.4 0c-1.08 0-1.96-.99-1.96-2.2s.86-2.2 1.96-2.2 1.98.99 1.96 2.2c0 1.21-.86 2.2-1.96 2.2z"/>
      </svg>
      Discord
    </div>

  </div>

  <div class="copyright">
    RD4X SYSTEM © 2026 — ALL RIGHTS RESERVED
  </div>
</footer>

</main>

<div class="notice">
  RD4X KEY ACCESS SYSTEM
</div>
</div>

<script>
const API_URL =
  "https://key-system.ronaldoo-sev7n.workers.dev";

const resultBox = document.getElementById("result");
const notice = document.getElementById("notice");
const generateButton = document.getElementById("generateButton");

let receivedHash = null;
let verifiedSessionId = null;
let verificationInProgress = false;

function showError(title, message) {
  generateButton.hidden = true;

  resultBox.innerHTML = `
    <div class="icon">✕</div>
    <div class="heading" style="color:#D66A78"></div>
    <p class="description"></p>
  `;

  resultBox.querySelector(".heading").textContent = title;
  resultBox.querySelector(".description").textContent = message;
}

function showVerified() {
  resultBox.innerHTML = `
    <div class="icon">✓</div>
    <div class="heading" style="color:#5BA677">
      LINKVERTISE CONFIRMADO
    </div>
    <p class="description">
      Seu acesso foi confirmado pelo servidor RD4X.
    </p>
  `;

  notice.textContent =
    "Verificação concluída. Clique abaixo para continuar.";

  generateButton.hidden = false;
  generateButton.disabled = false;
  generateButton.textContent = "GERAR CHAVE";
}

async function verifyLinkvertise(hash) {
  if (verificationInProgress) return;

  verificationInProgress = true;
  generateButton.hidden = true;

  resultBox.innerHTML = `
    <div class="icon">⏳</div>
    <div class="heading">VERIFICANDO LINKVERTISE</div>
    <p class="description">
      Estamos confirmando seu comprovante com o servidor.
    </p>
  `;

  notice.textContent =
    "Aguarde enquanto verificamos sua conclusão.";

  try {
    const response = await fetch(
      API_URL + "/api/linkvertise/verify",
      {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=UTF-8"
        },
        body: JSON.stringify({ hash })
      }
    );

    let data;

    try {
      data = await response.json();
    } catch {
      throw new Error("INVALID_SERVER_RESPONSE");
    }

    if (
      !response.ok ||
      data.ok !== true ||
      data.verified !== true ||
      typeof data.sessionId !== "string" ||
      data.sessionId.length < 10
    ) {
      const err = new Error(data.error || "VERIFICATION_FAILED");
      err.upstream = data.upstream;
      throw err;
    }

    verifiedSessionId = data.sessionId;

    sessionStorage.setItem(
      "rd4x_session",
      verifiedSessionId
    );

    showVerified();

  } catch (error) {
    console.error("RD4X:", error);

    showError(
      "VERIFICAÇÃO FALHOU",
      "Código recebido: " +
      (error.message || "ERRO DESCONHECIDO") +
      (error.upstream ? " | Linkvertise respondeu: " + error.upstream : "")
    );

    notice.textContent =
      "Volte ao início e tente novamente com um novo comprovante.";

  } finally {
    verificationInProgress = false;
  }
}

function extractParams() {
  const raw = window.location.search + window.location.hash;

  const viewMatch = raw.match(/[?&]view=([^&#?]*)/);
  const view = viewMatch ? decodeURIComponent(viewMatch[1]) : null;

  const hashMatch = raw.match(/[?&#]hash=([^&#]*)/);
  let hash = null;

  if (hashMatch) {
    try {
      hash = decodeURIComponent(hashMatch[1]);
    } catch {
      hash = hashMatch[1];
    }
  }

  return { view, hash, raw };
}

function describeArrival(raw, hash) {
  const names = Array.from(
    new Set(
      (raw.match(/[?&#]([^=&#?]+)=/g) || [])
        .map(x => x.slice(1, -1))
    )
  );

  let ref = "(vazio)";

  try {
    ref = document.referrer
      ? new URL(document.referrer).host
      : "(vazio)";
  } catch {}

  return (
    "Parâmetros recebidos: " + (names.join(", ") || "nenhum") +
    " | tamanho do hash: " + (hash ? hash.length : "ausente") +
    " | origem: " + ref
  );
}

function showGeneratedKey(key, expiresAt) {
  resultBox.innerHTML = `
    <div class="icon">✓</div>
    <div class="heading" style="color:#5BA677">
      KEY GERADA COM SUCESSO
    </div>
    <p class="description">
      Sua key RD4X está pronta.
    </p>
    <code id="generatedKey" style="
      display:block;
      margin-top:18px;
      padding:14px;
      background:#111116;
      border:1px solid #5BA677;
      border-radius:8px;
      color:#fff;
      word-break:break-all;
      font-size:13px;
    "></code>
    <button id="copyKeyButton" class="primary" type="button">
      COPIAR KEY
    </button>
    <p id="keyExpiry" class="description"></p>
  `;

  document.getElementById("generatedKey").textContent = key;

  document.getElementById("keyExpiry").textContent =
    "Expira em: " +
    new Date(expiresAt * 1000).toLocaleString("pt-BR");

  const copyButton =
    document.getElementById("copyKeyButton");

  copyButton.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(key);
      copyButton.textContent = "KEY COPIADA!";
    } catch {
      copyButton.textContent = "COPIE A KEY MANUALMENTE";
    }
  });

  generateButton.hidden = true;

  notice.textContent =
    "Guarde sua key RD4X em um local seguro.";
}

async function redeemSession() {
  if (!verifiedSessionId) {
    showError(
      "SESSÃO INVÁLIDA",
      "A verificação do servidor não foi concluída."
    );
    return;
  }

  generateButton.disabled = true;
  generateButton.textContent = "GERANDO KEY...";

  try {
    const response = await fetch(
      API_URL + "/api/session/redeem",
      {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=UTF-8"
        },
        body: JSON.stringify({
          sessionId: verifiedSessionId
        })
      }
    );

    const data = await response.json();

    if (
      !response.ok ||
      data.ok !== true ||
      typeof data.key !== "string" ||
      typeof data.expiresAt !== "number"
    ) {
      throw new Error(data.error || "GENERATION_FAILED");
    }

    // Remove o hash somente depois da geração confirmada.
    const url = new URL(window.location.href);
    url.searchParams.delete("hash");

    window.history.replaceState(
      {},
      document.title,
      url.pathname + url.search + url.hash
    );

    showGeneratedKey(data.key, data.expiresAt);

  } catch (error) {
    console.error("RD4X generation:", error);

    showError(
      "ERRO AO GERAR KEY",
      error.message || "Tente novamente."
    );

    generateButton.hidden = false;
    generateButton.disabled = false;
    generateButton.textContent = "TENTAR NOVAMENTE";
  }
}

generateButton.addEventListener("click", redeemSession);

function start() {
  const { view, hash, raw } = extractParams();

  if (view !== "key") {
    showError(
      "ACESSO NÃO INICIADO",
      "Inicie o processo pela página principal do RD4X."
    );
    return;
  }

  // Recupera uma sessão salva na mesma aba.
  const savedSessionId =
    sessionStorage.getItem("rd4x_session");

  if (
    savedSessionId &&
    /^[0-9a-f-]{36}$/i.test(savedSessionId)
  ) {
    verifiedSessionId = savedSessionId;
    showVerified();
    return;
  }

  receivedHash = hash;

  if (
    typeof receivedHash !== "string" ||
    receivedHash.length !== 64
  ) {
    showError(
      "HASH INVÁLIDO",
      "O comprovante recebido não possui exatamente 64 caracteres. " +
      describeArrival(raw, receivedHash)
    );
    return;
  }

  verifyLinkvertise(receivedHash);
}

start();
</script>

</body>
</html>
