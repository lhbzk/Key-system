
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0F0F12">
<title>RD4X | Key Generation</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --bg:#0F0F12;
  --surface:#18181D;
  --surface2:#1F1F25;
  --border:#302F36;
  --text:#EBE9EC;
  --muted:#918F97;
  --accent:#7E2B3E;
  --accent-dark:#5B1F2D;
  --green:#5BA677;
  --red:#D66A78;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  min-height:100vh;
  background:
    radial-gradient(ellipse at 50% 0%,#7e2b3e22,transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:Inter,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px 15px;
}

.container {
  width:100%;
  max-width:420px;
  animation:appear .7s ease;
}

@keyframes appear {
  from {opacity:0;transform:translateY(18px)}
  to {opacity:1;transform:translateY(0)}
}

.panel {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  padding:25px 21px;
  box-shadow:0 20px 70px #0008;
  position:relative;
  overflow:hidden;
}

.panel::before {
  content:"";
  position:absolute;
  top:0;
  left:12%;
  width:76%;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
}

.header {
  text-align:center;
  margin-bottom:25px;
}

.logo {
  width:82px;
  height:82px;
  object-fit:cover;
  border-radius:50%;
  padding:3px;
  background:linear-gradient(135deg,#A54860,#5B1F2D);
  border:2px solid #A54860;
  box-shadow:0 0 12px #7e2b3e66,0 0 28px #7e2b3e33;
  margin-bottom:13px;
}

.brand {
  font-family:Orbitron,sans-serif;
  font-size:25px;
  font-weight:800;
  letter-spacing:3px;
}

.brand span {
  color:#B65A70;
}

.subtitle {
  color:var(--muted);
  font-size:11px;
  letter-spacing:2px;
  margin-top:7px;
}

.status {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  margin-top:15px;
  font-size:10px;
  color:var(--green);
  letter-spacing:1px;
}

.status-dot {
  width:7px;
  height:7px;
  background:var(--green);
  border-radius:50%;
  box-shadow:0 0 9px var(--green);
}

.section-title {
  font-size:11px;
  font-weight:700;
  color:var(--muted);
  letter-spacing:1.5px;
  margin-bottom:12px;
}

.info-box {
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:17px;
  margin-top:15px;
  color:var(--muted);
  font-size:11px;
  line-height:1.7;
  text-align:center;
}

.icon {
  font-size:30px;
  margin-bottom:10px;
}

.heading {
  color:var(--text);
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
}

.description {
  margin-top:10px;
}

.primary {
  display:block;
  width:100%;
  border:0;
  border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  color:white;
  font-weight:800;
  font-size:12px;
  letter-spacing:1.5px;
  padding:15px;
  margin-top:18px;
  cursor:pointer;
  text-align:center;
  text-decoration:none;
}

.primary:disabled {
  opacity:.5;
  cursor:not-allowed;
}

.notice {
  font-size:9px;
  color:var(--muted);
  text-align:center;
  margin-top:13px;
  line-height:1.6;
}

.footer {
  text-align:center;
  margin-top:22px;
}

.footer-line {
  height:1px;
  background:var(--border);
  margin-bottom:17px;
}

.social-title {
  color:var(--muted);
  font-size:9px;
  letter-spacing:2px;
  margin-bottom:12px;
}

.social-links {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
}

.social-button {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:9px 12px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--surface2);
  color:var(--text);
  text-decoration:none;
  font-size:10px;
  font-weight:600;
}

.social-button svg {
  width:18px;
  height:18px;
  fill:currentColor;
}

.discord-disabled {
  opacity:.55;
  cursor:default;
}

.copyright {
  font-size:9px;
  color:#66636C;
  margin-top:16px;
}

@media(max-width:360px) {
  .panel {padding:22px 15px}
  .brand {font-size:22px}
}
</style>
</head>

<body>

  <div class="social-links">

        <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.33V2h-3.44v13.67a2.9 2.9 0 0 1-2.9 2.9 2.9 2.9 0 1 1 2.9-2.9c0-.2-.02-.4-.05-.59v-3.5a6.34 6.34 0 1 0 3.5 5.67V9.3a8.2 8.2 0 0 0 4.8 1.54V7.4a4.85 4.85 0 0 1-1.04-.71z"/>
      </svg>
      TikTok
    </a>

    <a
      href="https://www.instagram.com/n.x.z7?hvrq=MTBhMjA4dmMwNGI0dQ=="
      target="_blank"
      rel="noopener noreferrer"

    >
      <svg viewBox="0 0 24 24">
        <path d="M7 2C4.24 2 2 4.24 2 7v10c0 2.76 2.24 5 5 5h10c2.76 0 5-2.24 5-5V7c0-2.76-2.24-5-5-5H7zm0 2h10c1.66 0 3 1.34 3 3v10c0 1.66-1.34 3-3 3H7c-1.66 0-3-1.34-3-3V7c0-1.66 1.34-3 3-3zm11.5 1.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2zM12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/>

      </svg>
      Discord
    </div>

  </div>

  <div class="copyright">
    RD4X SYSTEM © 2026 — ALL RIGHTS RESERVED
  </div>
</footer>

</main>

<div class="notice">
  RD4X KEY ACCESS SYSTEM
</div>
</div>

<script>
const API_URL =
  "https://key-system.ronaldoo-sev7n.workers.dev";

const resultBox = document.getElementById("result");
const notice = document.getElementById("notice");

function showError(title, message) {
  resultBox.innerHTML = `
    <div class="icon">✕</div>
    <div class="heading" style="color:#D66A78"></div>
    <p class="description"></p>
  `;

  resultBox.querySelector(".heading").textContent = title;
  resultBox.querySelector(".description").textContent = message;

  notice.textContent =
    "Volte ao início para tentar novamente.";
}

function showSuccess(sessionId) {
  sessionStorage.setItem("rd4x_session", sessionId);

  resultBox.innerHTML = `
    <div class="icon">✓</div>

    <div class="heading" style="color:#5BA677">
      LINKVERTISE CONFIRMADO
    </div>

    <p class="description">
      Sua conclusão foi validada pelo servidor RD4X.
    </p>
  `;

  notice.textContent =
    "Próxima etapa: verificação do Discord e geração da Key.";
}

async function verifyLinkvertise(hash) {
  resultBox.innerHTML = `
    <div class="icon">⏳</div>
    <div class="heading">VERIFICANDO LINKVERTISE</div>
    <p class="description">
      Estamos confirmando sua conclusão com o servidor.
    </p>
  `;

  try {
    const response = await fetch(
      API_URL + "/api/linkvertise/verify",
      {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=UTF-8"
        },
        body: JSON.stringify({ hash })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.verified || !data.sessionId) {
      throw new Error(data.error || "VERIFICATION_FAILED");
    }

    showSuccess(data.sessionId);

  } catch (error) {
    console.error("RD4X:", error);

    showError(
      "VERIFICAÇÃO FALHOU",
      "Código recebido: " +
      (error.message || "ERRO DESCONHECIDO")
    );
  }
}

function start() {
  const params = new URLSearchParams(window.location.search);

  if (params.get("view") !== "key") {
    showError(
      "ACESSO NÃO INICIADO",
      "Inicie o processo pela página principal do RD4X."
    );
    return;
  }

  const hash = params.get("hash");

  // Remove o hash da barra de endereço após capturá-lo.
  window.history.replaceState(
    {},
    document.title,
    window.location.pathname + "?view=key"
  );

  if (typeof hash !== "string" || hash.length !== 64) {
    showError(
      "HASH INVÁLIDO",
      "O comprovante recebido não possui exatamente 64 caracteres."
    );
    return;
  }

  // ACEITA QUALQUER CARACTERE DESDE QUE TENHA 64 CARACTERES
  verifyLinkvertise(hash);
}

start();
</script>
